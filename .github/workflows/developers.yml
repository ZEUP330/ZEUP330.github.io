name: developers snapshot

on:
  schedule:
    # 09:30 UTC is 17:30 HKT / CST, after both the A-share close (15:00) and
    # the Hong Kong close (16:00), so the daily bar is final. Unlike the US
    # pages this one does not shift with daylight saving - neither market uses it.
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: developers-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build developer drawdown series
        run: node scripts/fetch-developers.mjs

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'ZEUP330'
          git config user.email '37589028+ZEUP330@users.noreply.github.com'
          git add developers/data
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          # Amend onto the previous snapshot so a daily 250KB blob does not land
          # in history every weekday. Only when HEAD is itself a snapshot commit,
          # so a hand-written commit is never rewritten.
          if git log -1 --pretty=%s | grep -q '^data: developers snapshot$'; then
            git commit --amend --no-edit --date=now
            git push --force-with-lease origin HEAD:main
          else
            git commit -m 'data: developers snapshot'
            git push origin HEAD:main
          fi
