name: drawdown snapshot

on:
  schedule:
    # 21:30 UTC on weekdays is 17:30 ET during EDT, an hour after the US close,
    # which leaves room for the closing print to settle. Shifts to 16:30 ET when
    # EST starts; still after the close, so the daily bar is final either way.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drawdown-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index drawdown series
        run: node scripts/fetch-drawdown.mjs

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'ZEUP330'
          git config user.email '37589028+ZEUP330@users.noreply.github.com'
          git add drawdown/data
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          # Amend onto the previous snapshot so a daily 250KB blob does not land
          # in history every weekday. Only when HEAD is itself a snapshot commit,
          # so a hand-written commit is never rewritten.
          if git log -1 --pretty=%s | grep -q '^data: drawdown snapshot$'; then
            git commit --amend --no-edit --date=now
            git push --force-with-lease origin HEAD:main
          else
            git commit -m 'data: drawdown snapshot'
            git push origin HEAD:main
          fi
