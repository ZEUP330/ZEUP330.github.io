name: hotel prices

on:
  # Hourly was the ask, and it was tried. Trip.com redirects GitHub's
  # datacenter IPs to /account/signin, so every scheduled run just hit a login
  # wall - six for six. Booking.com answers 202 with a challenge page,
  # Hotels.com answers 429, and Agoda serves a JS shell whose only "price"
  # strings are feature flags and i18n templates. None of them can be read
  # server-side without an authenticated session, which would mean putting
  # someone's OTA credentials in this repo.
  #
  # So the schedule is off rather than pounding a login wall 24 times a day.
  # Run it by hand if you want to check whether that has changed.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotel-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Scrape prices
        run: node scripts/fetch-hotel-prices.mjs

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'ZEUP330'
          git config user.email '37589028+ZEUP330@users.noreply.github.com'
          # package.json/lock and the browser cache are build artefacts, not content
          rm -f package.json package-lock.json
          git add changsha/data || true
          if git diff --cached --quiet; then
            echo 'no change'
            exit 0
          fi
          # Squash onto the previous price commit. Hourly commits would other-
          # wise add 24 blobs a day forever; only amend when HEAD is itself a
          # price commit so a hand-written commit is never rewritten.
          if git log -1 --pretty=%s | grep -q '^data: hotel prices$'; then
            git commit --amend --no-edit --date=now
            git push --force-with-lease origin HEAD:main
          else
            git commit -m 'data: hotel prices'
            git push origin HEAD:main
          fi
